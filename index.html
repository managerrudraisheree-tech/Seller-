<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RudraXspidey FF Store</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
background:#07080c;color:#fff;font-family:Arial,Helvetica,sans-serif
}
header{
position:sticky;top:0;z-index:10;
background:#0c0e13f5;
border-bottom:1px solid #3d321d
}
.nav{
max-width:1100px;margin:auto;padding:17px;
display:flex;justify-content:space-between;align-items:center
}
.logo{font-size:22px;font-weight:900;color:#e8bd55}
.logo span{color:#fff}
button,.buy{cursor:pointer}
.admin{
border:1px solid #d2ad51;background:transparent;
color:#e8bd55;padding:10px 14px;border-radius:10px
}
.wrap{
max-width:1100px;margin:auto;padding:25px 16px 60px
}
.hero{padding:20px 0}
.hero h1{font-size:38px;margin-bottom:8px}
.hero h1 span{color:#e8bd55}
.hero p{color:#8d9098}

.search{
width:100%;padding:15px;border-radius:12px;
border:1px solid #302d25;background:#11131a;
color:#fff;font-size:16px;margin:8px 0 24px;outline:0
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:17px
}
.card{
background:#101218;border:1px solid #2d2a23;
border-radius:17px;overflow:hidden
}
.pic{
width:100%;height:220px;object-fit:cover;
background:#171920;cursor:pointer
}
.body{padding:15px}
.title{font-weight:800;font-size:18px}
.muted{color:#858995;font-size:13px;margin-top:6px}
.price{
color:#e8bd55;font-size:21px;
font-weight:900;margin:13px 0
}
.view{
width:100%;border:0;padding:12px;
border-radius:10px;background:#d9ae4d;
font-weight:900
}
.empty{
text-align:center;color:#777;padding:55px 10px
}

/* MODAL */
.modal,.panel{
display:none;position:fixed;inset:0;
background:#000c;z-index:20;overflow:auto;padding:18px
}
.box{
max-width:650px;margin:15px auto;
background:#0e1016;border:1px solid #3b311e;
border-radius:20px;overflow:hidden;position:relative
}
.close{
position:absolute;right:12px;top:12px;
border:0;border-radius:50%;width:38px;height:38px;
background:#111a;color:#fff;font-size:22px;z-index:2
}
.main{
width:100%;height:350px;object-fit:cover;
background:#171920
}
.thumbs{
display:flex;gap:8px;overflow:auto;padding:10px
}
.thumbs img{
width:65px;height:65px;object-fit:cover;
border-radius:8px;cursor:pointer
}
.details{padding:20px}
.row{
display:flex;justify-content:space-between;
padding:13px 0;border-bottom:1px solid #26272c
}
.label{color:#888}
.buy{
display:block;text-align:center;
background:#d9ae4d;color:#111;
padding:14px;border-radius:10px;
margin-top:20px;font-weight:900
}

/* ADMIN */
.form{
max-width:620px;margin:auto;
background:#101218;border:1px solid #3b311e;
border-radius:18px;padding:20px
}
.form h2{color:#e8bd55;margin-bottom:20px}
.field{margin:14px 0}
.field label{
display:block;color:#999;font-size:13px;margin-bottom:7px
}
.field input{
width:100%;padding:13px;border-radius:9px;
border:1px solid #333;background:#08090d;
color:#fff;font-size:15px
}
.upload{
padding:18px;border:1px dashed #80672f;
border-radius:12px;color:#aaa;text-align:center
}
.save{
width:100%;padding:14px;border:0;
border-radius:10px;background:#d9ae4d;
font-weight:900;margin-top:15px
}
.list{margin-top:25px}
.item{
display:flex;justify-content:space-between;
align-items:center;padding:12px;
border:1px solid #292a2e;
border-radius:10px;margin-top:8px
}
.del{
border:0;background:#8c3030;
color:#fff;padding:8px;border-radius:7px
}
footer{
text-align:center;color:#666;padding:30px;font-size:12px
}

@media(max-width:600px){
.grid{grid-template-columns:1fr 1fr;gap:10px}
.pic{height:160px}
.hero h1{font-size:30px}
.main{height:280px}
.title{font-size:15px}
.price{font-size:18px}
}

@media(max-width:380px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">RudraXspidey <span>FF Store</span></div>
<button class="admin" onclick="openPanel()">+ Add Listing</button>
</div>
</header>

<main class="wrap">

<section class="hero">
<h1>Premium <span>Collections</span></h1>
<p>Explore available gaming collections.</p>
</section>

<input
id="search"
class="search"
placeholder="🔎 Search collection..."
oninput="render()"
>

<div id="grid" class="grid"></div>

</main>

<footer>
© 2026 RudraXspidey FF Store
</footer>


<!-- DETAILS -->

<div id="modal" class="modal">

<div class="box">

<button class="close" onclick="closeModal()">×</button>

<img id="main" class="main">

<div id="thumbs" class="thumbs"></div>

<div class="details">

<h2 id="dt"></h2>

<div class="row">
<span class="label">Account UID</span>
<b id="du"></b>
</div>

<div class="row">
<span class="label">ID No.</span>
<b id="di"></b>
</div>

<div class="row">
<span class="label">Price</span>
<b id="dp"></b>
</div>

<a id="buy" class="buy" target="_blank">
BUY NOW
</a>

</div>
</div>
</div>


<!-- ADMIN -->

<div id="panel" class="panel">

<div class="form">

<h2>Add New Collection</h2>

<div class="field">
<label>Collection Title</label>
<input id="title" placeholder="LEGENDRY LIMITED OFFER">
</div>

<div class="field">
<label>UID</label>
<input id="uid" placeholder="Enter UID">
</div>

<div class="field">
<label>ID No.</label>
<input id="idno" placeholder="1">
</div>

<div class="field">
<label>Price ₹</label>
<input id="price" type="number" placeholder="4500">
</div>

<div class="field">
<label>WhatsApp Number</label>
<input id="wa" placeholder="917205335244">
</div>

<div class="upload">

📸 Upload Collection Images

<br><br>

<input
id="files"
type="file"
accept="image/*"
multiple
>

</div>

<button class="save" onclick="addItem()">
SAVE COLLECTION
</button>

<button
class="save"
style="background:#191b21;color:#fff"
onclick="closePanel()"
>
CLOSE
</button>

<div class="list">

<h3 style="color:#e8bd55">
Your Listings
</h3>

<div id="manage"></div>

</div>

</div>
</div>


<script>

/* DATABASE */

const DB_NAME="RudraStoreDB";
const STORE_NAME="items";

let items=[];


/* OPEN DATABASE */

function openDB(){

return new Promise((resolve,reject)=>{

const request=indexedDB.open(DB_NAME,1);

request.onupgradeneeded=function(){

const db=request.result;

if(!db.objectStoreNames.contains(STORE_NAME)){
db.createObjectStore(
STORE_NAME,
{keyPath:"id",autoIncrement:true}
);
}

};

request.onsuccess=()=>{
resolve(request.result);
};

request.onerror=()=>{
reject(request.error);
};

});

}


/* LOAD ITEMS */

async function loadItems(){

try{

const db=await openDB();

items=await new Promise((resolve,reject)=>{

const transaction=
db.transaction(STORE_NAME,"readonly");

const store=
transaction.objectStore(STORE_NAME);

const request=store.getAll();

request.onsuccess=()=>{
resolve(request.result);
};

request.onerror=()=>{
reject(request.error);
};

});

render();

}

catch(error){

console.log(error);

}

}


/* ADD TO DATABASE */

async function saveItem(item){

const db=await openDB();

return new Promise((resolve,reject)=>{

const transaction=
db.transaction(STORE_NAME,"readwrite");

const store=
transaction.objectStore(STORE_NAME);

const request=store.add(item);

request.onsuccess=()=>{
resolve(request.result);
};

request.onerror=()=>{
reject(request.error);
};

});

}


/* DELETE */

async function deleteItem(id){

const db=await openDB();

return new Promise((resolve,reject)=>{

const transaction=
db.transaction(STORE_NAME,"readwrite");

const store=
transaction.objectStore(STORE_NAME);

const request=store.delete(id);

request.onsuccess=()=>{
resolve();
};

request.onerror=()=>{
reject(request.error);
};

});

}


/* IMAGE READER */

function readImage(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=function(){
resolve(reader.result);
};

reader.onerror=function(){
reject(
new Error("Could not read "+file.name)
);
};

reader.readAsDataURL(file);

});

}


/* ESCAPE TEXT */

function esc(text){

return String(text).replace(
/[&<>"']/g,
function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char];

}
);

}


/* RENDER WEBSITE */

function render(){

const query=
document.getElementById("search")
.value
.toLowerCase();

const filtered=items.filter(function(item){

return (
item.title+
item.uid+
item.idno
)
.toLowerCase()
.includes(query);

});

const grid=
document.getElementById("grid");


if(filtered.length===0){

grid.innerHTML=`

<div class="empty">

<h2>No Collections Found</h2>

<p>
Tap + Add Listing to add your first collection.
</p>

</div>

`;

return;

}


grid.innerHTML=filtered.map(function(item){

return `

<div class="card">

<img
class="pic"
src="${item.images[0]}"
onclick="details(${item.id})"
>

<div class="body">

<div class="title">
${esc(item.title)}
</div>

<div class="muted">
UID: ${esc(item.uid)}
</div>

<div class="muted">
ID No: ${esc(item.idno)}
</div>

<div class="price">
₹${Number(item.price).toLocaleString("en-IN")}
</div>

<button
class="view"
onclick="details(${item.id})"
>
VIEW DETAILS
</button>

</div>

</div>

`;

}).join("");

}


/* DETAILS */

function details(id){

const item=
items.find(function(x){
return x.id===id;
});

if(!item)return;

document.getElementById("modal")
.style.display="block";

document.getElementById("main")
.src=item.images[0];

document.getElementById("dt")
.textContent=item.title;

document.getElementById("du")
.textContent=item.uid;

document.getElementById("di")
.textContent=item.idno;

document.getElementById("dp")
.textContent=
"₹"+
Number(item.price)
.toLocaleString("en-IN");


document.getElementById("thumbs")
.innerHTML=
item.images.map(function(image){

return `

<img
src="${image}"
onclick="
document.getElementById('main').src=this.src
"
>

`;

}).join("");


let number=
item.wa.replace(/\D/g,"");


document.getElementById("buy").href=
"https://wa.me/"+
number+
"?text="+
encodeURIComponent(
"Hello, I am interested in "+
item.title+
" (ID No. "+
item.idno+
")"
);

}


/* CLOSE DETAILS */

function closeModal(){

document.getElementById("modal")
.style.display="none";

}


/* ADMIN */

function openPanel(){

document.getElementById("panel")
.style.display="block";

renderManage();

}


function closePanel(){

document.getElementById("panel")
.style.display="none";

}


/* ADD LISTING */

async function addItem(){

try{

const title=
document.getElementById("title")
.value.trim();

const uid=
document.getElementById("uid")
.value.trim();

const idno=
document.getElementById("idno")
.value.trim();

const price=
document.getElementById("price")
.value.trim();

const wa=
document.getElementById("wa")
.value.trim();

const fileInput=
document.getElementById("files");

const files=
Array.from(fileInput.files);


if(
!title||
!uid||
!idno||
!price||
!wa
){

alert(
"Please fill all details."
);

return;

}


if(files.length===0){

alert(
"Please select at least 1 image."
);

return;

}


if(files.length>20){

alert(
"Maximum 20 images allowed."
);

return;

}


const images=[];


for(const file of files){

if(file.size>8*1024*1024){

alert(
file.name+
" is larger than 8MB."
);

return;

}

const image=
await readImage(file);

images.push(image);

}


const newItem={

title:title,
uid:uid,
idno:idno,
price:price,
wa:wa,
images:images

};


await saveItem(newItem);

await loadItems();

renderManage();


/* CLEAR */

document.getElementById("title").value="";
document.getElementById("uid").value="";
document.getElementById("idno").value="";
document.getElementById("price").value="";
document.getElementById("wa").value="";
document.getElementById("files").value="";


alert(
"Collection saved successfully ✅"
);

}

catch(error){

console.error(error);

alert(
"Save failed. Try smaller images."
);

}

}


/* MANAGE LIST */

function renderManage(){

const box=
document.getElementById("manage");


if(items.length===0){

box.innerHTML=
"<p style='color:#777'>No listings yet.</p>";

return;

}


box.innerHTML=
items.map(function(item){

return `

<div class="item">

<span>

<b>
${esc(item.title)}
</b>

<br>

<small style="color:#888">
₹${Number(item.price).toLocaleString("en-IN")}
</small>

</span>

<button
class="del"
onclick="removeListing(${item.id})"
>
DELETE
</button>

</div>

`;

}).join("");

}


/* REMOVE */

async function removeListing(id){

if(!confirm(
"Delete this collection?"
))return;

await deleteItem(id);

await loadItems();

renderManage();

}


/* CLOSE MODAL WHEN OUTSIDE CLICK */

window.onclick=function(event){

if(
event.target===
document.getElementById("modal")
){

closeModal();

}

};


/* START */

loadItems();

</script>

</body>
</html>
